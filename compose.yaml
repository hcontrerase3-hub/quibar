x-app: &app
  image: ${QUIBAR_IMAGE:-quibar-app:local}
  environment: &environment
    QUIBAR_DB_PATH: /state/quibar.sqlite3
    QUIBAR_MEDIA_DIR: /state/media
    QUIBAR_TILES_PATH: /state/map.mbtiles
    QUIBAR_DIST_DIR: /app/dist
    OLLAMA_URL: ${OLLAMA_URL:-http://ollama:11434}
    QUIBAR_MODEL: ${QUIBAR_MODEL:-qwen3:14b-q4_K_M}
    QUIBAR_MODEL_TIMEOUT: ${QUIBAR_MODEL_TIMEOUT:-6}
    QUIBAR_MODEL_KEEP_ALIVE: ${QUIBAR_MODEL_KEEP_ALIVE:--1}
    QUIBAR_MODEL_PULL: ${QUIBAR_MODEL_PULL:-1}
    QUIBAR_OLLAMA_MODE: ${QUIBAR_OLLAMA_MODE:-docker}
    QUIBAR_ROUTING_DIR: /state/routing
    QUIBAR_ROUTING_URL: ${QUIBAR_ROUTING_URL:-http://routing:8002}
    QUIBAR_SPEECH_URL: ${QUIBAR_SPEECH_URL:-http://speech:5000}
    QUIBAR_WALK_DETOUR_MIN: ${QUIBAR_WALK_DETOUR_MIN:-5}
    QUIBAR_DRIVE_DETOUR_MIN: ${QUIBAR_DRIVE_DETOUR_MIN:-10}
    QUIBAR_ADMIN_NETWORKS: 127.0.0.1/32
  volumes:
    - state:/state
    - socket:/run/quibar
  init: true
  security_opt: [no-new-privileges:true]

services:
  app:
    <<: *app
    build: .
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, backend.container_ops, health]
      interval: 5s
      timeout: 4s
      retries: 20
      start_period: 15s
  nginx:
    image: nginx:1.28-alpine
    ports: ['127.0.0.1:${QUIBAR_PORT:-8000}:8080']
    volumes:
      - ./ops/docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - socket:/run/quibar:ro
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8080/api/quibar/health']
      interval: 5s
      timeout: 4s
      retries: 12
  maintenance:
    <<: *app
    command: [python, -m, backend.container_ops, maintenance]
    restart: unless-stopped
    depends_on:
      app: {condition: service_healthy}
  routing:
    image: ghcr.io/valhalla/valhalla-scripted@sha256:eaad372b8ef31e3e4592c442875aeb1375fbf5aeaa0d259b469e3b46583ab10d
    profiles: [territory]
    entrypoint: [/bin/sh, /quibar/start.sh]
    volumes:
      - state:/state
      - ./ops/routing/start.sh:/quibar/start.sh:ro
    environment:
      path_extension: ''
      server_threads: '2'
      build_elevation: 'False'
      build_time_zones: 'False'
      build_admins: 'True'
      use_default_speeds_config: 'False'
    restart: unless-stopped
  speech:
    profiles: [territory]
    build:
      context: .
      dockerfile: ops/speech/Dockerfile
    volumes: [voices:/models]
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
  ollama:
    image: ollama/ollama:0.18.0
    profiles: [ollama]
    volumes: [models:/root/.ollama]
    restart: unless-stopped
  model-init:
    <<: *app
    profiles: [model]
    command: [python, -m, backend.container_ops, model]
    volumes: []
    restart: 'no'
  tools:
    <<: *app
    profiles: [tools]
    command: [python, -m, backend.cli, --help]
volumes:
  state:
  socket:
  models:
  voices:
