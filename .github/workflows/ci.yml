name: Comprobar Quibar
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: pip install -r backend/requirements.lock
      - run: python -m unittest backend.test_quibar backend.test_stack backend.test_container -v
      - run: bash -n quibar ops/docker/acceptance.sh iniciar-quibar.command ops/install.sh ops/install-native.sh ops/manage.sh ops/kiosk/browser.sh ops/kiosk/autostart
      - run: ops/install.sh . --kiosk --dry-run
      - run: python -m unittest discover -s ops/docker -p 'test_*.py' -v
  containers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: ops/docker/acceptance.sh
      - shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/ops/docker/quibar.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { throw ($errors | Out-String) }
