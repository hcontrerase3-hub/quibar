# Only the loopback-published proxy can reach the application's Unix socket.
# Never relay user-provided forwarding addresses to the administrative filter.
map $http_x_forwarded_proto $quibar_scheme {
    default $scheme;
    https https;
}
server {
    listen 8080;
    server_tokens off;
    client_max_body_size 9m;
    location / {
        proxy_pass http://unix:/run/quibar/app.sock;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For 127.0.0.1;
        proxy_set_header X-Forwarded-Proto $quibar_scheme;
        proxy_set_header Forwarded '';
        proxy_read_timeout 125s;
    }
}
